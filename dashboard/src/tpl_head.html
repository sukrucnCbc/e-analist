<title>Ak Tuhafiye Büyüme Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F5F4F7; --surface:#FFFFFF; --surface2:#FAF9FB; --ink:#1C1A24; --muted:#686476; --faint:#9A96A6; --line:#E3E0E9;
  --accent:#A3244F; --accent-soft:#F6E4EA; --teal:#1E6E73; --teal-soft:#E0F0F0; --gold:#A8741A; --gold-soft:#F8EEDB;
  --good:#2E7D4F; --good-soft:#E3F2E8; --bad:#B8322A; --bad-soft:#F8E3E1; --hero:#A3244F; --core:#1E6E73; --rising:#C0831C; --tail:#8C879A;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --orb-hi:#BFE0FF; --orb:#3B82F6; --orb-lo:#1E40AF; --orb-glow:rgba(37,99,235,.45); --ai-1:#2F7FF0; --ai-2:#8B5CF6; --ai-3:#16A36A; --ai-4:#F07A1A; --cov-0:#C8372D; --cov-50:#E6B12E; --cov-100:#1B6A39; --r:10px; --shadow:0 1px 2px rgba(28,26,36,.05), 0 6px 18px -10px rgba(28,26,36,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
  --bg:#131118; --surface:#1C1A23; --surface2:#211E29; --ink:#EDEAF2; --muted:#A7A2B4; --faint:#7B7689; --line:#2F2B39;
  --accent:#E3638C; --accent-soft:#3A1E2A; --teal:#57B6BB; --teal-soft:#16302F; --gold:#E0AA4A; --gold-soft:#342913;
  --good:#5CC285; --good-soft:#15301F; --bad:#EE6B5F; --bad-soft:#3A1B18; --orb-glow:rgba(59,130,246,.55); --ai-1:#4A93FF; --ai-2:#A07CFA; --ai-3:#2DBE83; --ai-4:#FF8F3A; --cov-0:#E0564B; --cov-50:#E4B043; --cov-100:#2C8C50; --hero:#E3638C; --core:#57B6BB; --rising:#E0AA4A; --tail:#8E899C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);}
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#131118; --surface:#1C1A23; --surface2:#211E29; --ink:#EDEAF2; --muted:#A7A2B4; --faint:#7B7689; --line:#2F2B39;
  --accent:#E3638C; --accent-soft:#3A1E2A; --teal:#57B6BB; --teal-soft:#16302F; --gold:#E0AA4A; --gold-soft:#342913;
  --good:#5CC285; --good-soft:#15301F; --bad:#EE6B5F; --bad-soft:#3A1B18; --orb-glow:rgba(59,130,246,.55); --ai-1:#4A93FF; --ai-2:#A07CFA; --ai-3:#2DBE83; --ai-4:#FF8F3A; --cov-0:#E0564B; --cov-50:#E4B043; --cov-100:#2C8C50; --hero:#E3638C; --core:#57B6BB; --rising:#E0AA4A; --tail:#8E899C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.55;margin:0}
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:0 60px}
@media (max-width:600px){.wrap{padding-inline:16px}}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:14px 0}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;justify-content:space-between}
.brand h1{font-size:clamp(20px,2.4vw,26px);font-weight:800}
.brand h1 span{color:var(--accent)}
.brand .meta{color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:600 13.5px var(--body);padding:10px 14px 11px;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;border-radius:6px 6px 0 0}
.tab:hover{color:var(--ink);background:var(--surface2)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible,.i:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* sections */
.panel{padding-top:26px;display:grid;gap:22px}
.sec{display:grid;gap:14px}
.sech{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:9px;
  background-image:linear-gradient(90deg,var(--line) 50%,transparent 50%);background-size:10px 1.5px;background-repeat:repeat-x;background-position:bottom}
.sech h2{font-size:clamp(18px,2vw,21px);font-weight:700}
.sech p{margin:0;color:var(--muted);font-size:13px;max-width:70ch}
.eyebrow{font:600 11px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,172px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.card .sub{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px 12px;display:grid;gap:3px;align-content:start;position:relative}
.kpi .lab{display:flex;align-items:center;gap:6px;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.kpi .val{font:600 23px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.15}
.kpi .val small{font-size:13px;color:var(--muted);font-weight:500}
.kpi .note{font-size:12px;color:var(--muted)}
.kpi .code{font:600 10.5px var(--mono);color:var(--accent);letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--body);padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--gold-soft);color:var(--gold)} .pill.neu{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.kpi.s-bad{box-shadow:inset 3px 0 0 var(--bad)} .kpi.s-warn{box-shadow:inset 3px 0 0 var(--gold)} .kpi.s-good{box-shadow:inset 3px 0 0 var(--good)}
/* info icon */
.i{appearance:none;flex:none;width:17px;height:17px;border-radius:50%;border:1.3px solid var(--faint);background:transparent;color:var(--muted);font:italic 700 10.5px Georgia,serif;display:inline-grid;place-items:center;cursor:help;padding:0;line-height:1}
.i:hover,.i[aria-expanded="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
#tip{position:fixed;z-index:100;max-width:min(360px,calc(100vw - 24px));background:var(--ink);color:var(--bg);border-radius:9px;padding:11px 13px;font-size:12.8px;line-height:1.5;box-shadow:0 12px 30px -8px rgba(0,0,0,.45);pointer-events:none}
#tip b{color:inherit} #tip .t-h{font:700 13px var(--display);margin-bottom:4px;display:block} #tip .t-w{display:block;margin-top:6px;padding-top:6px;border-top:1px solid color-mix(in srgb,var(--bg) 25%,transparent)}
/* charts */
.chart{position:relative;height:260px} .chart.tall{height:330px} .chart.short{height:200px}
/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 11.5px var(--body);color:var(--muted);letter-spacing:.03em;background:var(--surface2);position:sticky;top:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td.wt{white-space:normal;min-width:220px}
td{vertical-align:top}
table.txt td{white-space:normal;min-width:130px;max-width:360px}
table.txt td:first-child{min-width:150px}
/* recommendations */
.recs{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,390px),1fr))}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;display:grid;gap:5px;align-content:start}
.rec .rh{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.rec h4{font:700 14.5px var(--display);line-height:1.3}
.rec p{margin:0;font-size:13.3px;color:var(--ink)}
.rec .why{color:var(--muted);font-size:12.5px}
.rec .imp{font:600 11.5px var(--mono);color:var(--teal)}
.tag{font:600 10.5px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;white-space:nowrap}
.tag.ciro{background:var(--teal-soft);color:var(--teal)} .tag.kar{background:var(--accent-soft);color:var(--accent)} .tag.ikisi{background:var(--gold-soft);color:var(--gold)}
.callout{border-radius:var(--r);padding:14px 16px;background:var(--accent-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.callout.teal{background:var(--teal-soft);border-color:color-mix(in srgb,var(--teal) 30%,transparent)}
.callout.gold{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 30%,transparent)}
.callout h3{font-size:15.5px;margin-bottom:4px}
.callout p{margin:0;font-size:13.5px}
.list{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13.4px}
.seg{display:inline-block;font:700 10.5px var(--body);padding:2px 7px;border-radius:4px;color:#fff;letter-spacing:.04em}
.seg.Hero{background:var(--hero)} .seg.Core{background:var(--core)} .seg.Rising{background:var(--rising)} .seg.LongTail{background:var(--tail)}
.bar{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden;min-width:60px} .bar > i{display:block;height:100%;background:var(--accent);border-radius:4px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.ctl{display:grid;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.ctl input[type=range]{width:170px;accent-color:var(--accent)}
.seg-btns{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg-btns button{appearance:none;border:0;background:var(--surface);color:var(--muted);font:600 12.5px var(--body);padding:6px 11px;cursor:pointer;border-right:1px solid var(--line)}
.seg-btns button:last-child{border-right:0}
.seg-btns button[aria-pressed="true"]{background:var(--accent);color:#fff}
.heat{display:grid;grid-template-columns:78px repeat(8,1fr);gap:3px;font-size:11px;min-width:520px}
.heat div{padding:6px 2px;text-align:center;border-radius:4px;font-family:var(--mono)}
.heat .h{background:none;color:var(--muted);font-family:var(--body);font-weight:600}
.timeline{display:grid;gap:10px}
.tl{display:grid;grid-template-columns:140px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tl .when{font:600 12.5px var(--mono);color:var(--accent)}
.tl h4{font:700 14.5px var(--display);margin-bottom:3px}
.tl p{margin:0;font-size:13.2px}
.tl .spec{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
@media (max-width:600px){.tl{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px} .kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);text-align:right}
.sim-out{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.foot{color:var(--muted);font-size:12px;margin-top:10px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)} .legend span{display:inline-flex;align-items:center;gap:5px} .legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* raporlar sekmesi */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--body);padding:8px 14px;border-radius:8px;cursor:pointer;min-height:36px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.rp-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.rp-actions{display:flex;gap:8px;flex-wrap:wrap}
.rp-status{border-radius:8px;padding:10px 13px;font-size:13px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.rp-status.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.rp-status.err{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.rp-status.busy{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.rp-scroll{overflow-x:auto;padding-bottom:4px}
.rp-grid{display:grid;grid-template-columns:minmax(112px,auto) repeat(12,minmax(26px,46px));gap:6px;align-items:center;justify-content:start;min-width:max-content}
.rp-grid .rl{font-size:12.5px;color:var(--muted);white-space:nowrap;padding-right:6px}
.rp-grid .rl.main{color:var(--ink);font-weight:600}
.rp-grid .mh{font:600 11.5px var(--body);color:var(--muted);text-align:center}
.rp-cell{appearance:none;border:0;padding:0;margin:0;width:100%;aspect-ratio:1;border-radius:6px;cursor:pointer;background:var(--c);transition:transform .12s}
.rp-cell.big{border-radius:8px;display:grid;place-items:center;font:600 11.5px var(--mono);color:var(--fg,#fff)}
.rp-cell:hover{transform:scale(1.08)}
.rp-cell.future,.rp-sw.future{background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line);cursor:default;color:var(--faint)}
.rp-cell.future:hover{transform:none}
.rp-grid .gap{grid-column:1/-1;height:4px}
.rp-legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.rp-ramp{display:inline-block;width:120px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--cov-0),var(--cov-50),var(--cov-100))}
.rp-sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:10px}
.rp-log{white-space:pre-wrap;font:12px/1.5 var(--mono);color:var(--muted);max-height:320px;overflow:auto;margin:10px 0 0}
details.card summary{cursor:pointer;font:700 14.5px var(--display)}
#rp-dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(460px,calc(100vw - 32px));box-shadow:var(--shadow)}
#rp-dialog::backdrop{background:rgba(10,8,14,.45)}
#rp-form{display:grid;gap:12px;padding:18px}
#rp-form h3{font-size:17px}
#rp-form label{display:grid;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
#rp-form select,#rp-form input[type=file]{font:500 14px var(--body);color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.rp-period{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rp-where{font-size:12.5px;color:var(--muted);margin-top:-6px}
.rp-msg{margin:0;font-size:13px;min-height:1em}
.rp-msg.err{color:var(--bad)} .rp-msg.ok{color:var(--good)}
.rp-dlg-actions{display:flex;justify-content:flex-end;gap:8px}

/* ai asistan */
.ai-fab{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:91;appearance:none;border:0;background:none;padding:6px;cursor:pointer;border-radius:50%;animation:ai-float 4.2s ease-in-out infinite}
.ai-fab:hover .orb{transform:scale(1.07)}
.ai-fab.pop .orb{animation:ai-pop .45s cubic-bezier(.3,1.6,.5,1)}
.ai-fab[aria-expanded="true"] .orb{transform:scale(.9);filter:saturate(1.15)}
.orb{--s:58px;display:block;width:var(--s);height:var(--s);border-radius:50%;position:relative;transition:transform .25s ease,filter .25s;
  background:radial-gradient(circle at 34% 28%,var(--orb-hi) 0%,color-mix(in srgb,var(--orb-hi) 30%,var(--orb)) 18%,var(--orb) 46%,var(--orb-lo) 100%);
  box-shadow:0 10px 26px -4px var(--orb-glow),inset -6px -10px 18px rgba(10,20,80,.35)}
.orb::after{content:"";position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle,var(--orb-glow) 0%,transparent 62%);z-index:-1;animation:ai-glow 4.2s ease-in-out infinite}
.orb.img{background:var(--orb-img) center/contain no-repeat;box-shadow:none}
.orb.img::after{inset:0;opacity:.6}
.orb.big{--s:84px;margin:0 auto 14px;animation:ai-float 4.2s ease-in-out infinite}
.orb.sm{--s:26px;flex:none;box-shadow:0 4px 10px -3px var(--orb-glow)}
.orb.sm::after{display:none}
@keyframes ai-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes ai-glow{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:.9;transform:scale(1.06)}}
@keyframes ai-pop{0%{transform:scale(1)}35%{transform:scale(.82)}70%{transform:scale(1.12)}100%{transform:scale(.9)}}
.ai-panel{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(max(20px,env(safe-area-inset-bottom)) + 82px);z-index:90;width:min(400px,calc(100vw - 32px));max-height:min(620px,calc(100dvh - 130px));
  display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px -18px rgba(20,16,40,.45);
  transform-origin:calc(100% - 30px) calc(100% + 50px);animation:ai-in .32s cubic-bezier(.2,.9,.3,1.15)}
.ai-panel.closing{animation:ai-out .2s ease-in forwards}
@keyframes ai-in{from{opacity:0;transform:scale(.6) translateY(20px)}to{opacity:1;transform:none}}
@keyframes ai-out{to{opacity:0;transform:scale(.7) translateY(16px)}}
.ai-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px 22px}
.ai-head h2{font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px}
.ai-badge{font:600 10.5px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);padding:2px 7px;border-radius:99px}
.ai-x{appearance:none;border:0;background:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.ai-x:hover{background:var(--surface2);color:var(--ink)}
.ai-panel svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ai-body{flex:1;overflow-y:auto;padding:6px 20px 4px;min-height:0}
.ai-hello{text-align:center;padding:14px 6px 10px}
.ai-greet{font:700 17px var(--display);margin:0 0 4px}
.ai-sub{margin:0;color:var(--muted);font-size:13px}
.ai-msgs{display:grid;gap:10px;padding-bottom:6px}
.ai-msg{max-width:88%;padding:9px 13px;border-radius:16px;font-size:13.8px;line-height:1.5;animation:ai-msg .25s ease-out}
.ai-msg.me{justify-self:end;background:var(--orb);color:#fff;border-bottom-right-radius:5px}
.ai-row{display:flex;gap:8px;align-items:flex-end}
.ai-msg.bot{background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:5px}
.ai-msg.bot b{color:var(--gold)}
@keyframes ai-msg{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ai-dots{display:inline-flex;gap:4px;padding:3px 0}
.ai-dots i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:ai-dot 1s infinite}
